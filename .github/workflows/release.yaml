name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (leave empty for auto-detect from git)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        
      - name: 🎯 Set tag
        env:
          VERSION_INPUT: ${{ steps.vars.outputs.version_input }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            TAG="$VERSION_INPUT"
          else
            TAG=$(git tag --points-at HEAD 2>/dev/null || echo "v1.0.0")
          fi
          COMMIT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          echo "commit_hash=$COMMIT" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          echo "timestamp=$TIMESTAMP" >> $GITHUB_ENV

      - name: 🔧 Configure Linux Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libpulse-dev libnss3-dev libxkbcommon-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-tools gstreamer1.0-libav

      - name: Check GStreamer if Present
        run: |
          gst-inspect-1.0 --version
          ls -l /usr/lib/x86_64-linux-gnu/gstreamer-1.0/

      - name: 🏗️ Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'

      - name: Download Package Deps
        run: flutter pub get

      - name: 🔍 Static Analysis
        run: dart analyze --fatal-errors || exit 0

      - name: 🧪 Run Tests
        run: flutter test --no-pub || exit 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧹 Remove local-only gradle.properties settings
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' android/gradle.properties
          fi

      - name: 📋 View Git Information
        run: |
          echo "=== GIT INFO ==="
          git log -1 --pretty=fuller
          echo "================"

      - name: Build Release (Linux)
        run: ./build.sh linux release

      - name: Build Release (APK)
        run: ./build.sh android release

      - name: Package ZIP (Linux)
        run: zip -r mima_linux-${{ env.tag }}.zip build/linux/x64/release/bundle

      - name: Package APK (Android)
        run: zip -r mima_android-${{ env.tag }}.apk.zip build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            mima_linux-${{ env.tag }}.zip
            mima_android-${{ env.tag }}.apk.zip
          tag_name: ${{ env.tag }}
          name: Release ${{ env.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}